# ######## Window rules ########
windowrule = opacity $windowOpacity override, match:fullscreen 0

windowrule = opacity 1.0 override, match:class ^(foot|equibop|org\.quickshell|imv|swappy)$  # They use native transparency or we want them opaque
windowrule = center 1, match:float true, match:xwayland false  # Center all floating windows (not xwayland cause popups)

